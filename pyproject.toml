[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openjev"
version = "0.1.0"
description = "Turn any local LLM into a Jev-style System One decision engine: type-safe answers with raw softmax probabilities, 100% offline."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "OpenJev contributors" }]
keywords = [
    "jev",
    "system-one",
    "decision-model",
    "llm",
    "local-llm",
    "classification",
    "softmax",
    "typesafe",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "huggingface_hub",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
openjev = "openjev.cli:main"
openjev-easy = "openjev.easy_cli:main"
openjev-web = "openjev.webapp:main"

[tool.setuptools]
packages = ["openjev"]
